<!-- This is test html for payment after webhook call getting -->
<!DOCTYPE html>
<html>
  <head>
    <title>Razorpay Test Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <h2>Razorpay Test Payment</h2>
    <button id="payBtn">Pay ₹50</button>

    <script>
      document.getElementById("payBtn").onclick = function () {
        var options = {
          key: "rzp_test_Rz811JxfXEZz1K",
          // change based on amount
          amount: 50000,
          currency: "INR",
          name: "Test Shop",
          description: "Test Payment",
          // change for based on create order
          order_id: "order_RzBwhboouJKw4e",

          handler: function (response) {
            alert(
              "Payment successful!\nPayment ID: " + response.razorpay_payment_id
            );
            console.log(response);
          },

          prefill: {
            name: "John Doe",
            email: "john@example.com",
            contact: "8075754525",
          },

          method: {
            card: true,
            netbanking: false,
            upi: false,
            wallet: false,
          },

          notes: {
            test_payment: "This is a test payment",
          },

          theme: {
            color: "#3399cc",
          },
        };

        var rzp = new Razorpay(options);
        rzp.open();
      };
    </script>
  </body>
</html>
